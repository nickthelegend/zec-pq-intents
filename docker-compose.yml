# Lightweight hackathon-demo deployment on the VPS behind Coolify's Traefik (network "coolify").
# Redeploy: cd /opt/hk/yaksok && docker compose up -d --build
# Read-only desk over the published pass-3 record (deployments/testnet-pass3.json, log entries 0-14).
# No secrets: there is no .env. Writes answer "Setup required" (a live desk needs PQI_STATE with seeds and wallets).
services:
  desk:
    build: .
    image: hk-yaksok:latest
    restart: unless-stopped
    mem_limit: 192m
    environment:
      PQI_PUBLISHED: /app/deployments/testnet-pass3.json
      PQI_ALLOWED_HOSTS: yaksok-api.201-18-198-162.sslip.io
    networks: [coolify]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8404/api/info').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.http.routers.hk-yaksok-api.rule=Host(`yaksok-api.201-18-198-162.sslip.io`)
      - traefik.http.routers.hk-yaksok-api.entrypoints=https
      - traefik.http.routers.hk-yaksok-api.tls=true
      - traefik.http.routers.hk-yaksok-api.tls.certresolver=letsencrypt
      - traefik.http.services.hk-yaksok-api.loadbalancer.server.port=8404
networks:
  coolify:
    external: true
